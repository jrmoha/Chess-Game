name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # ── macOS Intel (x86_64) ──────────────────────────────────────────────────
  build-macos-intel:
    runs-on: macos-13          # GitHub's Intel runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install Python deps
        run: pip install pyinstaller pygame python-chess

      - name: Download Stockfish (Intel)
        run: |
          mkdir -p stockfish
          curl -L "https://github.com/official-stockfish/Stockfish/releases/latest/download/stockfish-macos-x86-64-modern.tar" -o /tmp/sf.tar
          tar -xf /tmp/sf.tar -C /tmp
          find /tmp -maxdepth 2 -name "stockfish*" -type f -perm +111 | head -1 | xargs -I{} cp {} stockfish/stockfish
          chmod +x stockfish/stockfish

      - name: Create chess.icns
        run: |
          mkdir -p /tmp/chess.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size chess.png --out /tmp/chess.iconset/icon_${size}x${size}.png > /dev/null
            sips -z $((size*2)) $((size*2)) chess.png --out /tmp/chess.iconset/icon_${size}x${size}@2x.png > /dev/null
          done
          iconutil -c icns /tmp/chess.iconset -o chess.icns

      - name: Build .app
        run: pyinstaller --clean chess.spec

      - name: Create .dmg
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Chess" \
            --volicon chess.icns \
            --window-pos 200 120 \
            --window-size 600 380 \
            --icon-size 100 \
            --icon "Chess.app" 175 180 \
            --hide-extension "Chess.app" \
            --app-drop-link 425 180 \
            "Chess-macOS-x86_64.dmg" \
            "dist/Chess.app"

      - uses: actions/upload-artifact@v4
        with:
          name: Chess-macOS-x86_64
          path: Chess-macOS-x86_64.dmg

  # ── macOS Apple Silicon (arm64) ───────────────────────────────────────────
  build-macos-arm64:
    runs-on: macos-14          # GitHub's M1 runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install Python deps
        run: pip install pyinstaller pygame python-chess

      - name: Download Stockfish (Apple Silicon)
        run: |
          mkdir -p stockfish
          curl -L "https://github.com/official-stockfish/Stockfish/releases/latest/download/stockfish-macos-m1-apple-silicon.tar" -o /tmp/sf.tar
          tar -xf /tmp/sf.tar -C /tmp
          find /tmp -maxdepth 2 -name "stockfish*" -type f -perm +111 | head -1 | xargs -I{} cp {} stockfish/stockfish
          chmod +x stockfish/stockfish

      - name: Create chess.icns
        run: |
          mkdir -p /tmp/chess.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size chess.png --out /tmp/chess.iconset/icon_${size}x${size}.png > /dev/null
            sips -z $((size*2)) $((size*2)) chess.png --out /tmp/chess.iconset/icon_${size}x${size}@2x.png > /dev/null
          done
          iconutil -c icns /tmp/chess.iconset -o chess.icns

      - name: Build .app
        run: pyinstaller --clean chess.spec

      - name: Create .dmg
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Chess" \
            --volicon chess.icns \
            --window-pos 200 120 \
            --window-size 600 380 \
            --icon-size 100 \
            --icon "Chess.app" 175 180 \
            --hide-extension "Chess.app" \
            --app-drop-link 425 180 \
            "Chess-macOS-arm64.dmg" \
            "dist/Chess.app"

      - uses: actions/upload-artifact@v4
        with:
          name: Chess-macOS-arm64
          path: Chess-macOS-arm64.dmg

  # ── Windows ───────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install Python deps
        run: pip install pyinstaller pygame python-chess Pillow

      - name: Download Stockfish (Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stockfish
          Invoke-WebRequest "https://github.com/official-stockfish/Stockfish/releases/latest/download/stockfish-windows-x86-64-avx2.zip" -OutFile "$env:TEMP\sf.zip"
          Expand-Archive "$env:TEMP\sf.zip" -DestinationPath "$env:TEMP\sf"
          Get-ChildItem "$env:TEMP\sf" -Recurse -Filter "stockfish*.exe" | Select-Object -First 1 | Copy-Item -Destination "stockfish\stockfish.exe"

      - name: Create chess.ico
        run: python -c "from PIL import Image; img=Image.open('chess.png'); img.save('chess.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build
        run: pyinstaller --clean chess.spec

      - name: Zip output
        run: Compress-Archive -Path dist\Chess -DestinationPath Chess-Windows-x86_64.zip
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: Chess-Windows-x86_64
          path: Chess-Windows-x86_64.zip

  # ── Linux x86_64 ─────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install system deps
        run: sudo apt-get install -y libsdl2-dev libsdl2-mixer-dev libsdl2-image-dev libsdl2-ttf-dev

      - name: Install Python deps
        run: pip install pyinstaller pygame python-chess

      - name: Download Stockfish (Linux)
        run: |
          mkdir -p stockfish
          curl -L "https://github.com/official-stockfish/Stockfish/releases/latest/download/stockfish-ubuntu-x86-64-avx2.tar" -o /tmp/sf.tar
          tar -xf /tmp/sf.tar -C /tmp
          find /tmp -maxdepth 2 -name "stockfish*" -type f ! -name "*.tar" | head -1 | xargs -I{} cp {} stockfish/stockfish
          chmod +x stockfish/stockfish

      - name: Build
        run: pyinstaller --clean chess.spec

      - name: Archive
        run: tar -czf Chess-Linux-x86_64.tar.gz -C dist Chess

      - uses: actions/upload-artifact@v4
        with:
          name: Chess-Linux-x86_64
          path: Chess-Linux-x86_64.tar.gz

  # ── Create GitHub Release ────────────────────────────────────────────────
  release:
    needs: [build-macos-intel, build-macos-arm64, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
